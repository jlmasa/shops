server:
    port: 8082
spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/inventory
        username: postgres
        password: postgres
    jpa:
        hibernate: { ddl-auto: validate }
        open-in-view: false
    kafka:
        bootstrap-servers: localhost:9092
        consumer:
            group-id: inventory
            auto-offset-reset: earliest
        producer:
            acks: all
