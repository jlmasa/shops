server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/orders
    username: postgres
    password: postgres
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orders
      auto-offset-reset: earliest
    producer:
      acks: all
